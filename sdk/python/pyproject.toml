[project]
name = "aobs"
version = "0.1.0.dev0"
description = "Vendor-neutral instrumentation SDK for AI agents (stdlib-only core)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []   # deliberately none: the SDK must not conflict with the host application's dependencies

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aobs"]
