# Virtual uv workspace root. Packages live in server/ (and sdk/python/ from Phase 2).
[tool.uv.workspace]
members = ["server", "sdk/python"]

[dependency-groups]
dev = [
  "pytest>=8",
  "hypothesis>=6",
  "jsonschema>=4.23",
  "rfc3339-validator>=0.1.4",
  "ruff>=0.6",
  "mypy>=1.11",
  "openai>=3.29,<4",  # tests of the openai_compat integration (SDK itself does not depend on it)
  "anthropic>=2.1,<3",  # tests of the anthropic integration (SDK itself does not depend on it)
  "httpx>=0.28",  # FastAPI TestClient in server tests
  "playwright>=1.55,<2",  # dashboard browser tests (uses the Chromium installed by `playwright install chromium`)
  "opentelemetry-proto>=1.27,<2",  # OTLP conformance checks in the OTLP exporter tests (the SDK itself stays stdlib-only)
  "langchain-core>=1.6.13,<2",  # tests of the langchain integration (SDK itself does not depend on it)
  "langgraph>=1.2.16,<2",  # LangGraph graphs in the langchain integration tests and example
]
# Documentation site (mkdocs.yml). Not installed by a plain `uv sync`: use `uv run --group docs mkdocs ...`.
docs = [
  "mkdocs>=1.6,<2",  # MkDocs 2 is a backward-incompatible rewrite that Material does not support
  "mkdocs-material>=9.5,<10",
]

[tool.pytest.ini_options]
testpaths = ["server/tests", "sdk/python/tests"]
addopts = "-ra --strict-markers"
markers = [
  "pg: needs a real PostgreSQL 16 (throwaway cluster or AOBS_TEST_DATABASE_URL); deselect with -m 'not pg'",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
python_version = "3.11"
plugins = ["pydantic.mypy"]
mypy_path = ["server/src", "sdk/python/src"]

[tool.ruff.lint.isort]
known-first-party = ["aobs", "aobs_server", "support", "sdk_support", "pg", "tenants", "ingest_support"]
